{% comment %}
Uso:
  {% include 'partials/back_button.html' with href=url_var text='Volver al listado' %}
Si no se pasa href, hace history.back().
{% endcomment %}
<a
  {% if href %}href="{{ href }}"{% else %}href="#" onclick="window.history.back(); return false;"{% endif %}
  class="btn btn-secondary btn-back d-inline-flex align-items-center gap-2"
>
  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
    <path fill-rule="evenodd" d="M15 8a.5.5 0 0 1-.5.5H2.707l3.147 3.146a.5.5 0 0 1-.708.708l-4-4a.5.5 0 0 1 0-.708l4-4a.5.5 0 1 1 .708.708L2.707 7.5H14.5A.5.5 0 0 1 15 8z"/>
  </svg>
  {{ text|default:'Volver' }}
</a>
